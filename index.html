<!-- ==========================================
     SBL Citation Generator (Two-Step Wizard Edition)
     ========================================== -->
<div class="sbl-widget-container">
    <h2>SBL Citation Generator</h2>
    
    <!-- STEP 1: INITIAL SOURCE SELECTOR SCREEN -->
    <div id="sbl-step-1" class="sbl-wizard-step">
        <div class="sbl-form-group">
            <label for="sbl-type" style="font-size: 1.1rem; text-align: center; margin-bottom: 12px;">What type of source are you citing?</label>
            <select id="sbl-type" style="font-size: 1.1rem; padding: 12px;">
                <option value="book">Whole Book</option>
                <option value="chapter">Chapter or Essay in an Edited Book</option>
                <option value="article">Journal Article</option>
            </select>
        </div>
        <button type="button" id="sbl-btn-continue" class="sbl-primary-btn">Select & Continue →</button>
    </div>

    <!-- STEP 2: DYNAMIC FORM CONTAINER (Hidden initially) -->
    <div id="sbl-step-2" class="sbl-wizard-step" style="display: none;">
        <button type="button" id="sbl-btn-back" class="sbl-back-link">← Change Source Type</button>
        
        <!-- 1. AUTHOR & CONTRIBUTOR SECTION -->
        <fieldset class="sbl-fieldset">
            <legend>Authors & Contributors</legend>
            <div class="sbl-row">
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-first-name">Author First Name(s)</label>
                    <input type="text" id="sbl-first-name" placeholder="e.g. Charles H.">
                </div>
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-last-name">Author Last Name</label>
                    <input type="text" id="sbl-last-name" placeholder="e.g. Talbert">
                </div>
            </div>

            <!-- Book/Chapter Contributors Toggles -->
            <div id="grp-contributors">
                <div class="sbl-form-toggle-group">
                    <label><input type="checkbox" id="sbl-has-editor"> Has Editor(s)</label>
                    <label><input type="checkbox" id="sbl-has-translator"> Has Translator(s)</label>
                    <label><input type="checkbox" id="sbl-has-compiler"> Has Compiler(s)</label>
                </div>

                <!-- Editor Entry Row -->
                <div class="sbl-row sbl-sub-input-row" id="row-editor" style="display: none;">
                    <div class="sbl-form-group sbl-col">
                        <label for="sbl-ed-name">Editor Name(s) <span class="sbl-instruct">(First Last order)</span></label>
                        <input type="text" id="sbl-ed-name" placeholder="e.g. Thomas Williams">
                    </div>
                    <div class="sbl-form-group sbl-col-short">
                        <label for="sbl-ed-type">Role Assignment</label>
                        <select id="sbl-ed-type">
                            <option value="secondary">Secondary (Book has Author)</option>
                            <option value="primary">Primary (No Primary Author)</option>
                        </select>
                    </div>
                </div>

                <!-- Translator Entry Row -->
                <div class="sbl-form-group sbl-sub-input-row" id="row-translator" style="display: none;">
                    <label for="sbl-trans-name">Translator Name(s) <span class="sbl-instruct">(First Last order)</span></label>
                    <input type="text" id="sbl-trans-name" placeholder="e.g. Peter Heinegg">
                </div>

                <!-- Compiler Entry Row -->
                <div class="sbl-form-group sbl-sub-input-row" id="row-compiler" style="display: none;">
                    <label for="sbl-comp-name">Compiler Name(s) <span class="sbl-instruct">(First Last order)</span></label>
                    <input type="text" id="sbl-comp-name" placeholder="e.g. David Tombs">
                </div>
            </div>
        </fieldset>

        <!-- 2. TITLE FIELDSET -->
        <fieldset class="sbl-fieldset">
            <legend>Title Information</legend>
            
            <!-- Nested Chapter/Article Title -->
            <div class="sbl-form-group" id="grp-inner-title" style="display: none;">
                <label for="sbl-inner-title" id="lbl-inner-title">Chapter / Article Title</label>
                <input type="text" id="sbl-inner-title" placeholder="e.g. John Chrysostom on the Gaze">
            </div>

            <!-- Overarching Work Title -->
            <div class="sbl-row" id="row-main-title">
                <div class="sbl-form-group sbl-col-60">
                    <label for="sbl-title" id="lbl-title">Book Title</label>
                    <input type="text" id="sbl-title" placeholder="e.g. Reading John">
                </div>
                <div class="sbl-form-group sbl-col" id="grp-subtitle">
                    <label for="sbl-subtitle">Subtitle <span class="sbl-optional">(Optional)</span></label>
                    <input type="text" id="sbl-subtitle" placeholder="e.g. A Literary and Theological Commentary">
                </div>
            </div>
            
            <!-- Short Title -->
            <div class="sbl-form-group">
                <label for="sbl-short-title">Short Title <span class="sbl-instruct">(For Short Subsequent Footnotes)</span></label>
                <input type="text" id="sbl-short-title" placeholder="e.g. Reading John">
            </div>
        </fieldset>

        <!-- 3. VOLUMES, EDITIONS, & SERIES -->
        <fieldset class="sbl-fieldset" id="grp-serial-metadata">
            <legend id="lbl-serial-legend">Volume & Series Info</legend>
            
            <!-- Journal Serial Metadata Grid -->
            <div class="sbl-row" id="row-journal-meta" style="display: none;">
                <div class="sbl-form-group sbl-col-60">
                    <label for="sbl-journal">Journal Abbreviation or Title</label>
                    <input type="text" id="sbl-journal" placeholder="e.g. JECS or Journal of Early Christian Studies">
                </div>
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-volume">Volume</label>
                    <input type="text" id="sbl-volume" placeholder="e.g. 1">
                </div>
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-issue">Issue <span class="sbl-optional">(Optional)</span></label>
                    <input type="text" id="sbl-issue" placeholder="e.g. 3">
                </div>
            </div>

            <!-- Monograph Volume and Edition Grid -->
            <div id="row-book-series-meta">
                <div class="sbl-row">
                    <div class="sbl-form-group sbl-col">
                        <label for="sbl-edition">Edition <span class="sbl-optional">(e.g., 2nd ed.)</span></label>
                        <input type="text" id="sbl-edition" placeholder="e.g. 2nd ed.">
                    </div>
                    <div class="sbl-form-group sbl-col">
                        <label for="sbl-vol-num">Vol. Number <span class="sbl-optional">(e.g., 2)</span></label>
                        <input type="text" id="sbl-vol-num" placeholder="e.g. 2">
                    </div>
                    <div class="sbl-form-group sbl-col">
                        <label for="sbl-total-vols">Total Volumes <span class="sbl-optional">(Whole set)</span></label>
                        <input type="text" id="sbl-total-vols" placeholder="e.g. 4 vols.">
                    </div>
                </div>
                <div class="sbl-row">
                    <div class="sbl-form-group sbl-col-60">
                        <label for="sbl-series-title">Series Title / Abbreviation</label>
                        <input type="text" id="sbl-series-title" placeholder="e.g. SBLDS or WBC">
                    </div>
                    <div class="sbl-form-group sbl-col">
                        <label for="sbl-series-num">Series No.</label>
                        <input type="text" id="sbl-series-num" placeholder="e.g. 42">
                    </div>
                </div>
                <div class="sbl-form-group" id="grp-vol-distinct-title">
                    <label for="sbl-vol-title">Individual Volume Title <span class="sbl-optional">(If distinct)</span></label>
                    <input type="text" id="sbl-vol-title" placeholder="e.g. The Historical-Critical Method">
                </div>
            </div>
        </fieldset>

        <!-- 4. IMPRINT LOGISTICS & ACCESS LOCATORS -->
        <fieldset class="sbl-fieldset">
            <legend>Publication Details & Access</legend>
            <div class="sbl-row" id="row-imprint">
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-city">Publication City</label>
                    <input type="text" id="sbl-city" placeholder="e.g. New York or Winona Lake, IN">
                </div>
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-publisher">Publisher</label>
                    <input type="text" id="sbl-publisher" placeholder="e.g. Crossroad">
                </div>
            </div>
            
            <div class="sbl-row">
                <div class="sbl-form-group sbl-col">
                    <label for="sbl-year">Year Published</label>
                    <input type="text" id="sbl-year" placeholder="e.g. 1992">
                </div>
                <div class="sbl-form-group sbl-col" id="grp-pages-field">
                    <label for="sbl-pages" id="lbl-pages">Page(s) Cited (For Note)</label>
                    <input type="text" id="sbl-pages" placeholder="e.g. 127">
                </div>
                <div class="sbl-form-group sbl-col" id="grp-range-field" style="display: none;">
