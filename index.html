
<div class="sbl-widget-container">
    <h2>SBL Citation Generator</h2>
    
    <!-- Source Type Selector -->
    <div class="sbl-form-group">
        <label for="sbl-type">Source Type</label>
        <select id="sbl-type">
            <option value="book">Book</option>
            <option value="article">Journal Article</option>
        </select>
    </div>

    <!-- Shared Fields -->
    <div class="sbl-form-group">
        <label for="sbl-author">Author (First Last)</label>
        <input type="text" id="sbl-author" placeholder="e.g. John Doe">
    </div>
    
    <div class="sbl-row">
        <div class="sbl-form-group sbl-col">
            <label for="sbl-title" id="lbl-title">Book Title</label>
            <input type="text" id="sbl-title" placeholder="e.g. The Meaning of the Text">
        </div>
        <div class="sbl-form-group sbl-col">
            <label for="sbl-short-title" id="lbl-short-title">Short Title (For Subsequent Notes)</label>
            <input type="text" id="sbl-short-title" placeholder="e.g. Meaning of the Text">
        </div>
    </div>

    <!-- Article-Specific Fields (Hidden by default) -->
    <div class="sbl-form-group sbl-conditional" id="grp-journal" style="display: none;">
        <label for="sbl-journal">Journal Title</label>
        <input type="text" id="sbl-journal" placeholder="e.g. Journal of Biblical Literature">
    </div>

    <div class="sbl-row sbl-conditional" id="grp-volume-issue" style="display: none;">
        <div class="sbl-form-group sbl-col">
            <label for="sbl-volume">Volume</label>
            <input type="text" id="sbl-volume" placeholder="e.g. 142">
        </div>
        <div class="sbl-form-group sbl-col">
            <label for="sbl-issue">Issue (Optional)</label>
            <input type="text" id="sbl-issue" placeholder="e.g. 3">
        </div>
    </div>

    <!-- Book-Specific Fields (Visible by default) -->
    <div class="sbl-row" id="grp-book-meta">
        <div class="sbl-form-group sbl-col">
            <label for="sbl-city">City of Publication</label>
            <input type="text" id="sbl-city" placeholder="e.g. Atlanta">
        </div>
        <div class="sbl-form-group sbl-col">
            <label for="sbl-publisher">Publisher</label>
            <input type="text" id="sbl-publisher" placeholder="e.g. SBL Press">
        </div>
    </div>

    <!-- Shared Footprint Fields -->
    <div class="sbl-row">
        <div class="sbl-form-group sbl-col">
            <label for="sbl-year">Year</label>
            <input type="text" id="sbl-year" placeholder="e.g. 2026">
        </div>
        <div class="sbl-form-group sbl-col">
            <label for="sbl-pages" id="lbl-pages">Pages (For Note)</label>
            <input type="text" id="sbl-pages" placeholder="e.g. 45">
        </div>
    </div>

    <!-- Article Overall Page Range (Hidden by default) -->
    <div class="sbl-form-group sbl-conditional" id="grp-range" style="display: none;">
        <label for="sbl-range">Full Article Page Range (For Bibliography)</label>
        <input type="text" id="sbl-range" placeholder="e.g. 210–235">
    </div>

    <!-- Output Box -->
    <div class="sbl-output-box">
        <div class="sbl-output-header">
            <div class="sbl-output-title">SBL First Footnote</div>
            <button class="sbl-copy-btn" onclick="copyCitation('sbl-noteOutput', this)">Copy</button>
        </div>
        <div id="sbl-noteOutput" class="sbl-citation">Fill in fields to see footnote...</div>
        
        <div class="sbl-output-header">
            <div class="sbl-output-title">SBL Subsequent Footnote (Short Form)</div>
            <button class="sbl-copy-btn" onclick="copyCitation('sbl-subnoteOutput', this)">Copy</button>
        </div>
        <div id="sbl-subnoteOutput" class="sbl-citation">Fill in fields to see subsequent note...</div>
        
        <div class="sbl-output-header">
            <div class="sbl-output-title">SBL Bibliography</div>
            <button class="sbl-copy-btn" onclick="copyCitation('sbl-bibOutput', this)">Copy</button>
        </div>
        <div id="sbl-bibOutput" class="sbl-citation">Fill in fields to see bibliography...</div>
    </div>
</div>

<!-- ==========================================
     Scoped Widget Styling 
     ========================================== -->

        background: #ffffff;

</style>

<!-- ==========================================
     Widget Logic Script
     ========================================== -->
<script>
(function() {
    const fields = ['sbl-type', 'sbl-author', 'sbl-title', 'sbl-short-title', 'sbl-city', 'sbl-publisher', 'sbl-year', 'sbl-pages', 'sbl-journal', 'sbl-volume', 'sbl-issue', 'sbl-range'];
    
    fields.forEach(id => {
        const el = document.getElementById(id);
        if(el) {
            if(id === 'sbl-type') {
                el.addEventListener('change', handleTypeChange);
            } else {
                el.addEventListener('input', generateSBLCitation);
            }
        }
    });

    function handleTypeChange() {
        const type = document.getElementById('sbl-type').value;
        const lblTitle = document.getElementById('lbl-title');
        const txtTitle = document.getElementById('sbl-title');
        const lblPages = document.getElementById('lbl-pages');

        if(type === 'book') {
            lblTitle.textContent = "Book Title";
            txtTitle.placeholder = "e.g. The Meaning of the Text";
            lblPages.textContent = "Pages (For Note)";
            document.getElementById('grp-book-meta').style.display = 'flex';
            document.getElementById('grp-journal').style.display = 'none';
            document.getElementById('grp-volume-issue').style.display = 'none';
            document.getElementById('grp-range').style.display = 'none';
        } else {
            lblTitle.textContent = "Article Title";
            txtTitle.placeholder = "e.g. Rhetoric and Meaning in Genesis";
            lblPages.textContent = "Specific Page Cited (For Note)";
            document.getElementById('grp-book-meta').style.display = 'none';
            document.getElementById('grp-journal').style.display = 'block';
            document.getElementById('grp-volume-issue').style.display = 'flex';
            document.getElementById('grp-range').style.display = 'block';
        }
        generateSBLCitation();
    }

    function generateSBLCitation() {
        const type = document.getElementById('sbl-type').value;
        const author = document.getElementById('sbl-author').value.trim();
        const title = document.getElementById('sbl-title').value.trim();
        const shortTitle = document.getElementById('sbl-short-title').value.trim();
        const year = document.getElementById('sbl-year').value.trim();
        const pages = document.getElementById('sbl-pages').value.trim();

        // Fallbacks
        const a = author || "[Author]";
        const y = year || "[Year]";
        const pg = pages || "[Page]";

        // Parse Author Names (Full & Surname Only)
        let bibAuthor = a;
        let surName = a;
        if (author && author.includes(" ")) {
            const names = author.split(" ");
            surName = names[names.length - 1]; 
            const last = names.pop();
            const first = names.join(" ");
            bibAuthor = `${last}, ${first}`;
        }
let noteOutput = "";let subnoteOutput = "";let bibOutput = "";if (type === 'book') {const city = document.getElementById('sbl-city').value.trim() || "[City]";const publisher = document.getElementById('sbl-publisher').value.trim() || "[Publisher]";const t = title ? <i>${title}</i> : "[Book Title]";const st = shortTitle ? <i>${shortTitle}</i> : (title ? <i>${title}</i> : "[Short Title]");noteOutput = ${a}, ${t} (${city}: ${publisher}, ${y}), ${pg}.;subnoteOutput = ${surName}, ${st}, ${pg}.;bibOutput = ${bibAuthor}. ${t}. ${city}: ${publisher}, ${y}.;} else {const journal = document.getElementById('sbl-journal').value.trim() || "[Journal]";const volume = document.getElementById('sbl-volume').value.trim() || "[Vol]";const issue = document.getElementById('sbl-issue').value.trim();const range = document.getElementById('sbl-range').value.trim() || "[Page Range]";const t = title ? "${title}" : '"[Article Title]"';const st = shortTitle ? "${shortTitle}" : (title ? "${title}" : '"[Short Title]"');const j = <i>${journal}</i>;const volIssue = issue ? ${volume}, no. ${issue} : volume;noteOutput = ${a}, ${t}, ${j} ${volume} (${y}): ${pg}.;subnoteOutput = ${surName}, ${st}, ${pg}.;bibOutput = ${bibAuthor}. ${t}. ${j} ${volIssue} (${y}): ${range}.;}document.getElementById('sbl-noteOutput').innerHTML = noteOutput;document.getElementById('sbl-subnoteOutput').innerHTML = subnoteOutput;document.getElementById('sbl-bibOutput').innerHTML = bibOutput;}// Global copy functionwindow.copyCitation = function(elementId, btn) {const textToCopy = document.getElementById(elementId).innerText;navigator.clipboard.writeText(textToCopy).then(() => {const originalText = btn.textContent;btn.textContent = "Copied!";btn.style.background = "#10b981";btn.style.borderColor = "#10b981";btn.style.color = "#ffffff";setTimeout(() => {btn.textContent = originalText;btn.style.background = "#ffffff";btn.style.borderColor = "#cbd5e1";btn.style.color = "#475569";}, 1500);});}})();
